<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechFest 2026 - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Navbar (Sama seperti sebelumnya) -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">🚀 TechFest 2026</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
        <li class="nav-item"><a class="nav-link" href="events.html">Kegiatan</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">Tentang</a></li>
        <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
      </ul>
    </div>
  </div>
</nav>

<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow">
          <div class="card-body p-4">
            <h2 class="text-center fw-bold mb-4">Login Peserta</h2>

            <!-- 1. ID alertBox HARUS ada -->
            <div id="alertBox"></div>

            <!-- 2. ID loginForm dan novalidate HARUS ada -->
            <form id="loginForm" novalidate>
              
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <!-- 3. ID email HARUS ada -->
                <input type="email" class="form-control" id="email" placeholder="nama@email.com">
                <!-- 4. ID emailError HARUS ada -->
                <div class="invalid-feedback" id="emailError"></div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <!-- 5. ID password HARUS ada -->
                <input type="password" class="form-control" id="password" placeholder="Minimal 8 karakter">
                <!-- 6. ID passwordError HARUS ada -->
                <div class="invalid-feedback" id="passwordError"></div>
              </div>

              <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="bg-dark text-white text-center py-4">
  <div class="container">
    <p class="mb-0">&copy; 2026 TechFest. All Rights Reserved.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- 7. Pastikan path file JS ini benar -->
<script src="js/login.js"></script>
</body>
</html>
